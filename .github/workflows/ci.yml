name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Measures (simulation cost, determinism)
        run: npm run measures
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (real input, drawn output, worker determinism, benchmark)
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results
          retention-days: 7
